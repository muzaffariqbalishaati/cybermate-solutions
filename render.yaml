services:
  - type: web
    name: openclaw-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node whatsapp-bot.cjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
